const vp=document.getElementById('vp'), wd=document.getElementById('wd'), el=document.getElementById('el'), zi=document.getElementById('zi');
const SVGNS='http://www.w3.org/2000/svg';
let pan={x:0,y:0}, zoom=1;
function computeArrowPoints(x1,y1,x2,y2,width){
  const angle=Math.atan2(y2-y1,x2-x1);
  const len=Math.hypot(x2-x1,y2-y1);
  const base=Math.max(8, width*2.2, Math.min(24, len*0.08));
  const spread=0.45;
  const bx=x2-base*Math.cos(angle-spread), by=y2-base*Math.sin(angle-spread);
  const cx=x2-base*Math.cos(angle+spread), cy=y2-base*Math.sin(angle+spread);
  return {pts:[[x2,y2],[bx,by],[cx,cy]], base, angle, len};
}
function apply(){ wd.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')'; zi.textContent=Math.round(zoom*100)+'%'; }

function vecBounds(v){
  const pad = v.width/2 + (v.type==='line' &amp;&amp; v.arrow ? Math.max(10, v.width*2.5) : 4);
  let minX,minY,maxX,maxY;
  if(v.type==='line'){
    minX=Math.min(v.x1,v.x2); maxX=Math.max(v.x1,v.x2);
    minY=Math.min(v.y1,v.y2); maxY=Math.max(v.y1,v.y2);
  } else {
    minX=Infinity;minY=Infinity;maxX=-Infinity;maxY=-Infinity;
    v.points.forEach(function(p){ minX=Math.min(minX,p[0]); maxX=Math.max(maxX,p[0]); minY=Math.min(minY,p[1]); maxY=Math.max(maxY,p[1]); });
  }
  return {minX:minX-pad, minY:minY-pad, maxX:maxX+pad, maxY:maxY+pad};
}

DATA.zOrder.forEach(function(id){
  const e = DATA.elementsById[id];
  const v = DATA.vectorsById[id];
  if(e){
    const d=document.createElement('div');
    d.className='obj';
    d.style.left=e.x+'px'; d.style.top=e.y+'px';
    d.style.transform='rotate('+(e.rot||0)+'deg)';
    d.style.opacity = (e.opacity==null?1:e.opacity);
    if(e.type==='image'){
      d.style.width=e.w+'px'; d.style.height=e.h+'px';
      d.innerHTML='<img src=&quot;'+e.src+'&quot;>';
    } else if(e.type==='text'){
      d.style.width='auto';
      const t=document.createElement('div');
      t.className='txt';
      t.style.color=e.color; t.style.fontSize=e.fontSize+'px';
      t.style.fontWeight=e.bold?'700':'400';
      t.style.textDecoration=e.underline?'underline':'none';
        t.style.whiteSpace = 'pre';
        t.style.wordBreak = 'normal';
      t.textContent=e.text;
      d.appendChild(t);
    }
    el.appendChild(d);
  } else if(v){
    const b = vecBounds(v);
    const w = Math.max(1,b.maxX-b.minX), h = Math.max(1,b.maxY-b.minY);
    const d=document.createElement('div');
    d.className='obj vec';
    d.style.left=b.minX+'px'; d.style.top=b.minY+'px'; d.style.width=w+'px'; d.style.height=h+'px';
    d.style.opacity = (v.opacity==null?1:v.opacity);
    const svgEl=document.createElementNS(SVGNS,'svg');
    svgEl.setAttribute('width',w); svgEl.setAttribute('height',h); svgEl.setAttribute('viewBox','0 0 '+w+' '+h);
    if(v.type==='line'){
      const x1=v.x1-b.minX, y1=v.y1-b.minY, x2=v.x2-b.minX, y2=v.y2-b.minY;
      // compute arrow metadata and shorten line if arrow exists
      let x2s=x2, y2s=y2;
      if(v.arrow){
        const meta = computeArrowPoints(x1,y1,x2,y2,v.width);
        const shorten = Math.min(meta.base*0.75, meta.len*0.25);
        x2s = x2 - shorten*Math.cos(meta.angle);
        y2s = y2 - shorten*Math.sin(meta.angle);
      }
      const line=document.createElementNS(SVGNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2s); line.setAttribute('y2',y2s);
      line.setAttribute('stroke', v.color); line.setAttribute('stroke-width', v.width);
      line.setAttribute('stroke-linecap','round');
      svgEl.appendChild(line);
      if(v.arrow){
        const meta = computeArrowPoints(x1,y1,x2,y2,v.width);
        const poly=document.createElementNS(SVGNS,'polygon');
        poly.setAttribute('points', meta.pts.map(function(p){ return p[0]+','+p[1]; }).join(' '));
        poly.setAttribute('fill', v.color);
        svgEl.appendChild(poly);
      }
    } else if(v.type==='path'){
      const dAttr=v.points.map(function(p,i){ return (i===0?'M':'L')+(p[0]-b.minX)+','+(p[1]-b.minY); }).join(' ');
      const path=document.createElementNS(SVGNS,'path');
      path.setAttribute('d', dAttr); path.setAttribute('stroke', v.color); path.setAttribute('stroke-width', v.width);
      path.setAttribute('fill','none'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round');
      svgEl.appendChild(path);
    }

// pan/zoom (read-only viewer)
// When this file is embedded in an <iframe> on someone else's page, a bare wheel/scroll
// or one-finger touch would otherwise &quot;scroll-jack&quot; the host page (the gesture gets
// captured by the board instead of scrolling the page around it). So when embedded:
// wheel needs Ctrl/Cmd held to zoom (bare wheel scrolls the host page normally), and
// panning needs two fingers on touch (one finger scrolls the host page normally).
const IN_IFRAME = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
let panning=false, start=null;
vp.addEventListener('mousedown', function(e){
  panning=true; start={x:e.clientX-pan.x,y:e.clientY-pan.y}; vp.classList.add('panning'); e.preventDefault();
});
window.addEventListener('mousemove', function(e){
  if(panning){ pan.x=e.clientX-start.x; pan.y=e.clientY-start.y; apply(); }
});
window.addEventListener('mouseup', function(){ panning=false; vp.classList.remove('panning'); });
vp.addEventListener('wheel', function(e){
  if(IN_IFRAME &amp;&amp; !(e.ctrlKey || e.metaKey)) return; // let the host page scroll normally
  e.preventDefault();
  const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const wb={x:(mx-pan.x)/zoom, y:(my-pan.y)/zoom};
  const factor=Math.exp(-e.deltaY*0.0015);
  zoom=Math.min(8, Math.max(0.05, zoom*factor));
  pan.x=mx-wb.x*zoom; pan.y=my-wb.y*zoom;
  apply();
}, {passive:false});
// touch support (basic)
let lastTouchDist=null, lastTouchMid=null;
vp.addEventListener('touchstart', function(e){
  if(e.touches.length===1){
    if(IN_IFRAME) return; // let a single finger scroll the host page normally
    panning=true; start={x:e.touches[0].clientX-pan.x,y:e.touches[0].clientY-pan.y};
  }
  else if(e.touches.length===2){
    panning=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    lastTouchDist=Math.hypot(dx,dy);
    lastTouchMid={x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
}, {passive:true});
vp.addEventListener('touchmove', function(e){
  if(e.touches.length===1 &amp;&amp; panning){
    pan.x=e.touches[0].clientX-start.x; pan.y=e.touches[0].clientY-start.y; apply();
  } else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    const r=vp.getBoundingClientRect();
    const mx=lastTouchMid.x-r.left, my=lastTouchMid.y-r.top;
    const wb={x:(mx-pan.x)/zoom, y:(my-pan.y)/zoom};
    zoom=Math.min(8, Math.max(0.05, zoom*(dist/lastTouchDist)));
    pan.x=mx-wb.x*zoom; pan.y=my-wb.y*zoom;
    lastTouchDist=dist; apply();
  }
}, {passive:true});
vp.addEventListener('touchend', function(){ panning=false; lastTouchDist=null; });

// small fading hint about the modifier-key/two-finger requirement, shown only when embedded
if(IN_IFRAME){
  const hint=document.createElement('div');
  hint.textContent='Ctrl/Cmd+scroll to zoom · two fingers to pan';

  document.body.appendChild(hint);
  setTimeout(function(){ hint.style.opacity='0'; setTimeout(function(){ hint.remove(); }, 700); }, 3500);
}


// initial fit

(function(){
  const b = DATA.bounds;
  const w = b.maxX-b.minX || 800, h=b.maxY-b.minY || 600;

  zoom = Math.min(vw/(w+120), vh/(h+120), 1.5);

  pan.x = vw/2 - (b.minX+w/2)*zoom;

  apply();
})();
