// When this file is embedded in an <iframe> on someone else's page, a bare wheel/scroll
// or one-finger touch would otherwise "scroll-jack" the host page (the gesture gets
// captured by the board instead of scrolling the page around it). So when embedded:
// wheel needs Ctrl/Cmd held to zoom (bare wheel scrolls the host page normally), and
// panning needs two fingers on touch (one finger scrolls the host page normally).
const IN_IFRAME = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
// touch-action is what actually stops the browser (notably iOS Safari) from racing its
// own gesture recognizers against ours — a two-finger touch left to "touch-action:auto"
// can get interpreted as a native pinch-zoom or, on iOS Safari specifically, misread as
// a tab-switch/edge-navigation gesture, since nothing has told the browser this element
// owns multi-touch. Standalone: we own every touch gesture ourselves, so claim all of
// them. Embedded: allow native vertical pan so a single finger still scrolls the host
// page (matching the touchstart/touchmove logic below); two-finger pinch-zoom is still
// held back to us since 'pinch-zoom' isn't in the allowed value.
vp.style.touchAction = IN_IFRAME ? 'pan-y' : 'none';
let panning=false, start=null;
vp.addEventListener('mousedown', function(e){
  markUserNavigated();
  panning=true; start={x:e.clientX-pan.x,y:e.clientY-pan.y}; vp.classList.add('panning'); e.preventDefault();
});
window.addEventListener('mousemove', function(e){
  if(panning){ pan.x=e.clientX-start.x; pan.y=e.clientY-start.y; apply(); }
});
window.addEventListener('mouseup', function(){ panning=false; vp.classList.remove('panning'); });
vp.addEventListener('wheel', function(e){
  if(IN_IFRAME && !(e.ctrlKey || e.metaKey)) return; // let the host page scroll normally
  e.preventDefault();
  markUserNavigated();
  const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const wb={x:(mx-pan.x)/zoom, y:(my-pan.y)/zoom};
  const factor=Math.exp(-e.deltaY*0.0015);
  zoom=Math.min(8, Math.max(0.05, zoom*factor));
  pan.x=mx-wb.x*zoom; pan.y=my-wb.y*zoom;
  apply();
}, {passive:false});
// touch support — deliberately NOT passive: touch-action above is the primary defense,
// but explicitly preventDefault()-ing every gesture we actually handle (single finger
// standalone, two fingers always) is the second layer that keeps iOS Safari from ever
// treating an in-progress pinch/pan as its own swipe/tab gesture.
let lastTouchDist=null, lastTouchMid=null;
// double-tap-to-zoom: a lot of mobile visitors will reflexively double-tap before they
// think to try pinching. Tracked independent of IN_IFRAME/panning state, since a tap (no
// movement) never conflicts with the host page's native scroll the way a drag would.
let tapStartPos=null, tapMoved=false, lastTapTime=0, lastTapPos=null;
const TAP_MOVE_TOLERANCE=12, DOUBLE_TAP_MS=300, DOUBLE_TAP_DIST=40, DOUBLE_TAP_ZOOM=2.5;
function doubleTapZoom(clientX, clientY){
  markUserNavigated();
  const r=vp.getBoundingClientRect(), mx=clientX-r.left, my=clientY-r.top;
  if(zoom < DOUBLE_TAP_ZOOM*0.9){
    const wb={x:(mx-pan.x)/zoom, y:(my-pan.y)/zoom};
    zoom=Math.min(8, DOUBLE_TAP_ZOOM);
    pan.x=mx-wb.x*zoom; pan.y=my-wb.y*zoom;
    apply();
  } else {
    fitView();
  }
}
vp.addEventListener('touchstart', function(e){
  if(e.touches.length===1){
    tapStartPos={x:e.touches[0].clientX,y:e.touches[0].clientY}; tapMoved=false;
    if(IN_IFRAME) return; // let a single finger scroll the host page normally
    e.preventDefault();
    markUserNavigated();
    panning=true; start={x:e.touches[0].clientX-pan.x,y:e.touches[0].clientY-pan.y};
  }
  else if(e.touches.length>=2){
    tapStartPos=null;
    e.preventDefault();
    markUserNavigated();
    panning=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    lastTouchDist=Math.hypot(dx,dy);
    lastTouchMid={x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
}, {passive:false});
vp.addEventListener('touchmove', function(e){
  if(e.touches.length===1){
    if(tapStartPos){
      const dx=e.touches[0].clientX-tapStartPos.x, dy=e.touches[0].clientY-tapStartPos.y;
      if(Math.hypot(dx,dy) > TAP_MOVE_TOLERANCE) tapMoved=true;
    }
    if(panning){
      e.preventDefault();
      pan.x=e.touches[0].clientX-start.x; pan.y=e.touches[0].clientY-start.y; apply();
    }
  } else if(e.touches.length>=2 && lastTouchDist!=null){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    const r=vp.getBoundingClientRect();
    const mx=lastTouchMid.x-r.left, my=lastTouchMid.y-r.top;
    const wb={x:(mx-pan.x)/zoom, y:(my-pan.y)/zoom};
    zoom=Math.min(8, Math.max(0.05, zoom*(dist/lastTouchDist)));
    pan.x=mx-wb.x*zoom; pan.y=my-wb.y*zoom;
    lastTouchDist=dist; apply();
  }
}, {passive:false});
vp.addEventListener('touchend', function(e){
  panning=false; lastTouchDist=null;
  if(tapStartPos && !tapMoved && e.changedTouches && e.changedTouches.length===1){
    const now=Date.now();
    const tapPos={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    if(lastTapTime && (now-lastTapTime)<DOUBLE_TAP_MS && lastTapPos && Math.hypot(tapPos.x-lastTapPos.x,tapPos.y-lastTapPos.y)<DOUBLE_TAP_DIST){
      doubleTapZoom(tapPos.x, tapPos.y);
      lastTapTime=0; lastTapPos=null;
    } else {
      lastTapTime=now; lastTapPos=tapPos;
    }
  } else {
    lastTapTime=0; lastTapPos=null;
  }
  tapStartPos=null; tapMoved=false;
});

// small fading hint about the modifier-key/two-finger requirement, shown only when embedded
if(IN_IFRAME){
  const hint=document.createElement('div');
  hint.textContent='Ctrl/Cmd+scroll to zoom · two fingers to pan';
  hint.style.cssText='position:fixed;bottom:10px;right:10px;background:rgba(37,40,46,.85);color:#e7e9ec;font:11px sans-serif;padding:5px 9px;border-radius:6px;z-index:5;pointer-events:none;transition:opacity .6s;';
  document.body.appendChild(hint);
  setTimeout(function(){ hint.style.opacity='0'; setTimeout(function(){ hint.remove(); }, 700); }, 3500);
}


// shared by initial load, the Fit button, and the resize/orientation-change handler below
function fitView(){
  const b = DATA.bounds;
  const w = b.maxX-b.minX || 800, h=b.maxY-b.minY || 600;
  const vw = window.innerWidth, vh = window.innerHeight;
  zoom = Math.min(vw/(w+120), vh/(h+120), 1.5);
  if(!isFinite(zoom) || zoom<=0) zoom=1;
  pan.x = vw/2 - (b.minX+w/2)*zoom;
  pan.y = vh/2 - (b.minY+h/2)*zoom;
  apply();
}
// initial fit
fitView();
document.getElementById('btnFitPrev').addEventListener('click', fitView);

// Re-fit on resize/orientation-change (e.g. rotating a phone) so the view doesn't end
// up mis-framed against the new viewport — but only while the visitor hasn't manually
// panned/zoomed yet, and only when the export was configured to fit on load; once
// someone has navigated the preview themselves, resizing shouldn't yank their view back.
let userNavigated = false;
function markUserNavigated(){ userNavigated = true; }
let resizeTimer = null;
window.addEventListener('resize', function(){
  if(!true || userNavigated) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitView, 150);
});
</script>
</body></html>
